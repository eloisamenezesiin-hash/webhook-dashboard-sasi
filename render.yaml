# ============================================================
# Render Blueprint — Deploy automático
# https://render.com/docs/blueprint-spec
# ============================================================

databases:
  - name: webhook-sasi-db
    plan: free
    databaseName: webhook_sasi
    user: sasi_user

services:
  # --- API FastAPI (recebe webhooks) ---
  - type: web
    name: webhook-sasi-api
    runtime: python
    plan: free
    repo: https://github.com/eloisamenezesiin-hash/webhook-dashboard-sasi
    branch: main
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-sasi-db
          property: connectionURI
      - key: REDIS_URL
        fromService:
          name: webhook-sasi-redis
          type: redis
          property: connectionURI
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: LOG_LEVEL
        value: "INFO"

  # --- Worker RQ (processa fila de eventos) ---
  - type: worker
    name: webhook-sasi-worker
    runtime: python
    plan: starter
    repo: https://github.com/eloisamenezesiin-hash/webhook-dashboard-sasi
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: rq worker webhook_events --url $REDIS_URL
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-sasi-db
          property: connectionURI
      - key: REDIS_URL
        fromService:
          name: webhook-sasi-redis
          type: redis
          property: connectionURI
      - key: PYTHON_VERSION
        value: "3.11.6"

  # --- Dashboard Plotly Dash ---
  - type: web
    name: webhook-sasi-dashboard
    runtime: python
    plan: free
    repo: https://github.com/eloisamenezesiin-hash/webhook-dashboard-sasi
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.dashboard.app:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-sasi-db
          property: connectionURI
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DASH_HOST
        value: "0.0.0.0"
      - key: DASH_DEBUG
        value: "false"

  # --- Redis ---
  - type: redis
    name: webhook-sasi-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
